<!-- STRUTTURA HTML PER LA SEZIONE SCONTRINI E IL MODALE ANTEPRIMA -->

<!-- Tab Content: Scontrini -->
<div id="tab-scontrini" class="tab-content" style="display:none;">
    <h2>Elenco Spese Registrate con Ricevuta</h2>
    <p>In questa sezione puoi visualizzare ed esaminare tutte le ricevute, foto e PDF allegati alle spese registrate.</p>
    
    <!-- Filtro rapido per ricerca scontrini -->
    <div style="margin-bottom: 15px;">
        <input type="text" id="filtroScontrini" placeholder="Cerca per descrizione o data..." onkeyup="filtrarScontrini()" style="padding: 8px; width: 300px; border-radius: 4px; border: 1px solid #ccc;">
    </div>

    <!-- Griglia / Contenitore per gli scontrini -->
    <div id="grigliaScontrini" class="scontrini-grid" style="display: flex; flex-wrap: wrap; gap: 20px;">
        <!-- Le schede degli scontrini verranno inserite dinamicamente qui -->
    </div>
</div>

<!-- Modal per Anteprima Ingrandita dell'Immagine / PDF -->
<div id="modalAnteprima" class="modal" style="display:none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center;">
    <div style="position: relative; background: #fff; padding: 20px; border-radius: 8px; max-width: 90%; max-height: 90%; display: flex; flex-direction: column; align-items: center;">
        <span onclick="chiudiModalAnteprima()" style="position: absolute; top: 10px; right: 15px; font-size: 28px; font-weight: bold; cursor: pointer; color: #333;">&times;</span>
        <h3 id="modalTitolo" style="margin-top: 0;">Anteprima Ricevuta</h3>
        <div id="modalContenuto" style="max-width: 100%; max-height: 80vh; overflow: auto; text-align: center;">
            <!-- Immagine o iframe PDF ingrandito -->
        </div>
    </div>
</div>
